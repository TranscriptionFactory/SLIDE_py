# SLIDE run configuration
# Usage: ./submit_ssc_array.sh ssc_config.yaml [--keep-env | /path/to/env]

data:
  x_path: /ix/djishnu/Aaron/1_general_use/SLIDE/Data_Scripts/SSc/UnTx/X.csv
  y_path: /ix/djishnu/Aaron/1_general_use/SLIDE/Data_Scripts/SSc/UnTx/Y.csv
  y_factor: false

slide:
  backends: [r_knockoffs, r, python]
  deltas: [0.01, 0.1]
  lambdas: [0.1, 1.0]
  niter: 500
  top_feats: 10
  fdr: 0.1
  thresh_fdr: 0.2
  pure_homo: true
  do_interacts: true
  n_workers: 4
  spec: 0.1
  love_backend: python
  knockoff_method: asdp
  knockoff_shrink: false
  knockoff_offset: 0
  fstat: glmnet_lambdasmax

cv:
  enabled: true
  nrep: 10
  k: 5
  eval_type: corr

output:
  base_dir: /ix/djishnu/Aaron/1_general_use/SLIDE_py/runs/ssc_multi_param/output

slurm:
  job_name: ssc_slide
  time: "2-12:00:00"
  mem: 50G
  cpus_per_task: 4
  cluster: htc
