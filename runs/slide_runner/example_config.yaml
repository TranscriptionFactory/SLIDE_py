# ─────────────────────────────────────────────────────────────────────────────
# SLIDE run configuration
# ─────────────────────────────────────────────────────────────────────────────
#
# Copy this file, fill in your data paths, and run:
#
#   ./submit_slide.sh my_config.yaml                  # build env, auto-cleanup
#   ./submit_slide.sh my_config.yaml --keep-env       # keep env for reuse
#   ./submit_slide.sh my_config.yaml /path/to/env     # reuse a pre-built env
#
# Paths:
#   - Absolute paths are used as-is.
#   - Relative paths (./output, ../data/X.csv) are resolved from this
#     config file's directory.
# ─────────────────────────────────────────────────────────────────────────────

data:
  x_path: /path/to/X.csv          # REQUIRED — features matrix
  y_path: /path/to/Y.csv          # REQUIRED — response vector
  y_factor: false                  # true if Y is categorical

slide:
  # Each backend becomes a separate SLURM array task.
  #   python       = Python LOVE + Python knockoffs
  #   r_knockoffs  = Python LOVE + R knockoffs
  #   r            = R LOVE      + R knockoffs
  backends: [r_knockoffs, r, python]

  deltas: [0.01, 0.1]
  lambdas: [0.1, 1.0]
  niter: 500
  top_feats: 10
  fdr: 0.1
  thresh_fdr: 0.2
  pure_homo: true
  do_interacts: true
  n_workers: 4
  spec: 0.1
  fstat: glmnet_lambdasmax
  knockoff_method: asdp            # asdp | sdp | equi
  knockoff_shrink: false
  knockoff_offset: 0

cv:
  enabled: true
  nrep: 10
  k: 5
  eval_type: corr                  # corr | mse

output:
  base_dir: ./output               # relative to this config file

# ─── Environment / HPC ───────────────────────────────────────────────────────

env:
  # Path to the loveslide repository (for building from source).
  # Falls back to git auto-detect if omitted.
  # Eventually: pip install loveslide   (and remove this field)
  project_dir: /ix/djishnu/Aaron/1_general_use/SLIDE_py

  # Path to mamba (or conda) binary. Auto-detected if omitted.
  # mamba: /path/to/mamba

  # Modules to load (set to [] on non-HPC systems)
  modules:
    - python/ondemand-jupyter-python3.11
    - r/4.4.0

  # Python version for fresh conda environments
  python_version: "3.11"

  # pip install extras (loveslide optional dependency groups)
  pip_extras: "dev,r,viz"

slurm:
  job_name: slide_run
  time: "2-12:00:00"
  mem: 50G
  cpus_per_task: 4
  cluster: htc
